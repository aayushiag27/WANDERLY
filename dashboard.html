<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Wanderly</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <header class="dashboard-header">

        <a href="index.html" class="logo">Wanderly</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="#trips">My Trips</a>
            <a href="#saved">Saved</a>
            <button id="logout">Log Out</button>
        </nav>

    </header>


    <main>

        <section class="welcome">

            <p>WELCOME BACK</p>

            <h1>Ready for your next adventure?</h1>

            <span>Plan your next extraordinary journey with Wanderly.</span>

            <div class="welcome-buttons">
                <button id="exploreBtn">Explore Destinations</button>
                <button id="tripsBtn">View My Trips</button>
            </div>

        </section>


        <section class="trips" id="trips">

            <h2>Upcoming Trips</h2>

            <div class="trip-cards">

                <div class="trip-card">

                    <img src="card1.jpg" alt="Amalfi Coast">

                    <div>
                        <h3>Amalfi Coast</h3>
                        <p>Italy</p>
                        <span>Luxury Summer Escape</span>
                    </div>

                </div>


                <div class="trip-card">

                    <img src="card3.jpg" alt="Swiss Alps">

                    <div>
                        <h3>Swiss Alps</h3>
                        <p>Switzerland</p>
                        <span>Alpine Serenity</span>
                    </div>

                </div>

            </div>

        </section>


        <section class="saved" id="saved">

            <h2>Saved Destinations</h2>

            <div class="saved-grid" id="savedGrid">
            </div>

        </section>

    </main>


    <script src="dashboard.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPORA | AKGEC Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN / START SECTION -->
    <div class="login-container" id="login">
        <div class="login-card">
            <div class="logo">CAMPORA</div>
            <h1>AKGEC Knowledge Challenge</h1>
            <p>How well do you know AKGEC?</p>

            <div class="input-group">
                <label for="username">Enter your name</label>
                <input type="text" id="username" placeholder="Your name" aria-label="Enter your name" required>
            </div>

            <button id="startBtn" type="button">Start Quiz</button>
        </div>
    </div>

    <!-- MAIN QUIZ SECTION -->
    <div class="quiz" id="quiz" style="display: none;">

        <nav class="quiz-nav">
            <div class="nav-brand">CAMPORA</div>
            <div class="user-info">
                <span id="name"></span>
            </div>
            <div class="timer-box">
                <span id="timer">10:00</span>
            </div>
            <button id="themeToggle" type="button">Light Mode</button>
        </nav>

        <main class="quiz-body">
            <div class="quiz-header">
                <p id="number">Question 1 of 10</p>
                <div class="status-bar">
                    <span class="status-badge attempted" id="attempted">Attempted: 0</span>
                    <span class="status-badge unattempted" id="unattempted">Unattempted: 10</span>
                    <span class="status-badge reviewed" id="reviewed">Review: 0</span>
                </div>
            </div>

            <div class="question-container">
                <h2 id="question"></h2>
                <div id="options" class="options-grid"></div>
            </div>

            <div class="controls">
                <button id="review" type="button" class="btn-secondary">Mark for Review</button>
                <button id="next" type="button" class="btn-primary">Next</button>
                <button id="endTest" type="button" class="btn-danger">End Test</button>
            </div>
        </main>

    </div>

    <!-- RESULT SECTION -->
    <div class="result" id="result" style="display: none;">
        <div class="result-card">
            <h1>Quiz Completed!</h1>
            <h2 id="finalScore"></h2>
            <p id="resultMessage"></p>

            <div class="summary">
                <div class="summary-item correct">
                    <p>Correct: <span id="correctCount">0</span></p>
                </div>
                <div class="summary-item incorrect">
                    <p>Incorrect: <span id="incorrectCount">0</span></p>
                </div>
                <div class="summary-item unattempted">
                    <p>Unattempted: <span id="unattemptedCount">0</span></p>
                </div>
            </div>

            <button id="reattempt" type="button" class="btn-primary">Reattempt Quiz</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
